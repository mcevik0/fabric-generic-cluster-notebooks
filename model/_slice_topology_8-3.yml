site_topology_nodes:
  nodes:
    node1:
      name: lc-1              
      hostname: lc-1          
      site: PSC
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9  
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: 
          fpga1:
            name: fpga1       # Logical name on the slice
            model: FPGA_Xilinx_U280
            interfaces:
              iface1:
                device: eth3          
                connection: conn-eth3
                binding: net_local_1   
                ipv4: {}
                ipv6: {}
              iface2:
                device: eth4
                connection: conn-eth4
                binding: net_local_2 
                ipv4: {}
                ipv6: {}
        gpu: {}
        nvme: {}
        network: {}
      specific:
        openstack:           # OpenStack role assignments
          control: 'true'    # Control plane node [STRING: 'true' or 'false']
          network: 'true'    # Network services node
          compute: 'false'   # Compute node (hypervisor)
          storage: 'true'    # Storage services node
        ansible:
          control: 'true'   # Ansible control node
          management_network: 'net_local_1'  # Ansible management network
          role: 'webserver'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: 'permissive'

        
# ==============================================================================
# NETWORKS CONFIGURATION
# ==============================================================================
# Define Layer 2/3 networks that connect nodes together
#
site_topology_networks:
  networks:
    net1:
      name: net_local_1
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:1::/64'
          gateway: '2001:db8:1234:1::1'
    net2:
      name: net_local_2
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.202.0/24
          gateway: 192.168.202.1
        ipv6:
          address: '2001:db8:1234:2::/64'
          gateway: '2001:db8:1234:2::1'


