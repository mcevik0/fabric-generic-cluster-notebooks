# ==============================================================================
# NETWORKS CONFIGURATION
# ==============================================================================
# Define Layer 2/3 networks that connect nodes together
#
site_topology_networks:
  networks:
    net1:
      name: s1_s2
      type: L2STS
      subnet:
        ipv4: {}
        ipv6: {}
    net2:
      name: s1_s3
      type: L2STS
      subnet:
        ipv4: {}
        ipv6: {}
    net3:
      name: s2_s3
      type: L2STS
      subnet:
        ipv4: {}
        ipv6: {}
    net4:
      name: s1_layer2
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:1::/64'
          gateway: '2001:db8:1234:1::1'
    net5:
      name: s2_layer2
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:1::/64'
          gateway: '2001:db8:1234:1::1'
    net6:
      name: s3_layer2
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:1::/64'
          gateway: '2001:db8:1234:1::1'
    net7:
      name: s1_layer3
      type: IPv4
      subnet: {}
    net8:
      name: s2_layer3
      type: IPv4
      subnet: {}
    net9:
      name: s3_layer3
      type: IPv4
      subnet: {}

# Facility Port definitions 
site_topology_facility_ports:
  facility_ports: {}

