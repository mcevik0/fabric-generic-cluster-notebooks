site_topology_nodes:
  nodes:
    node1:
      name: lc-1              
      hostname: lc-1          
      site: WASH
      worker: ''
      capacity:
        cpu: 16                
        ram: 64              
        disk: 100             
        os: default_ubuntu_24  
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: 
          gpu1:
            name: rtx6000     # Logical name on the slice
            model: GPU_RTX6000
        nvme:
          nvme1:
            name: nvme1       # Logical name on the slice
            model: NVME_P4510
        network:
          nic1:
            name: nic1       
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: net_local_1   
                ipv4:
                  address: 192.168.201.211/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:1::1/64'
                  gateway: '2001:db8:1234:1::1'
                  dns: '2001:4860:4860::8888'
          nic2:
            name: nic2
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth2
                connection: conn-eth2
                binding: net_local_2
                ipv4:
                  address: 192.168.202.211/24
                  gateway: 192.168.202.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:2::1/64'
                  gateway: '2001:db8:1234:2::1'
                  dns: '2001:4860:4860::8888'
      specific:
        openstack:           # OpenStack role assignments
          control: 'true'    # Control plane node [STRING: 'true' or 'false']
          network: 'true'    # Network services node
          compute: 'false'   # Compute node (hypervisor)
          storage: 'true'    # Storage services node
        ansible:
          control: 'true'   # Ansible control node
          role: 'webserver,loadbalancer'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: {}
        
    node2:
      name: lc-2              
      hostname: lc-2          
      site: WASH
      worker: ''
      capacity:
        cpu: 16                
        ram: 64              
        disk: 100             
        os: default_ubuntu_24 
      persistent_storage:
