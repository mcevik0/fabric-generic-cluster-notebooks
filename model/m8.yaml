# ==============================================================================
# NETWORKS CONFIGURATION
# ==============================================================================
# Define Layer 2/3 networks that connect nodes together
#

site_topology_networks:
  networks:
    net1:
      name: renci_duke
      type: L2STS
      subnet:
        ipv4:
          address: 192.168.11.0/24
          gateway: 192.168.11.1
        ipv6:
          address: '2001:db8:1234:11::/64'
          gateway: '2001:db8:1234:11::1'
    net2:
      name: duke_ncsu
      type: L2STS
      subnet:
        ipv4:
          address: 192.168.12.0/24
          gateway: 192.168.12.1
        ipv6:
          address: '2001:db8:1234:12::/64'
          gateway: '2001:db8:1234:12::1'
    net3:
      name: ncsu_unc
      type: L2STS
      subnet:
        ipv4:
          address: 192.168.13.0/24
          gateway: 192.168.13.1
        ipv6:
          address: '2001:db8:1234:13::/64'
          gateway: '2001:db8:1234:13::1'
    net4:
      name: unc_renci
      type: L2STS
      subnet:
        ipv4:
          address: 192.168.14.0/24
          gateway: 192.168.14.1
        ipv6:
          address: '2001:db8:1234:14::/64'
          gateway: '2001:db8:1234:14::1'
    net5:
      name: renci_internal
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:201::/64'
          gateway: '2001:db8:1234:201::1'
    net6:
      name: duke_internal
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.202.0/24
          gateway: 192.168.202.1
        ipv6:
          address: '2001:db8:1234:202::/64'
          gateway: '2001:db8:1234:202::1'
    net7:
      name: unc_internal
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.203.0/24
          gateway: 192.168.203.1
        ipv6:
          address: '2001:db8:1234:203::/64'
          gateway: '2001:db8:1234:203::1'
    net8:
      name: ncsu_internal
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.204.0/24
          gateway: 192.168.204.1
        ipv6:
          address: '2001:db8:1234:204::/64'
          gateway: '2001:db8:1234:204::1'
    net9:
      name: renci_l3_v4
      type: IPv4
      subnet: {}
    net10:
      name: duke_l3_v4
      type: IPv4
      subnet: {}
    net11:
      name: unc_l3_v4
      type: IPv4
      subnet: {}
    net12:
      name: ncsu_l3_v4
      type: IPv4
      subnet: {}
    net13:
      name: renci_l3_v6
      type: IPv6
      subnet: {}
    net14:
      name: duke_l3_v6
      type: IPv6
      subnet: {}
    net15:
      name: unc_l3_v6
      type: IPv6
      subnet: {}
    net16:
      name: ncsu_l3_v6
      type: IPv6
      subnet: {}

# Facility Port definitions 
site_topology_facility_ports:
  facility_ports: {}

