site_topology_nodes:
  nodes:
    node1:
      name: renci-br              
      hostname: renci-br         
      site: WASH
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1       
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: renci_duke   
                ipv4:
                  address: 192.168.11.11/24  
                  gateway: 192.168.11.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:11::11/64'
                  gateway: '2001:db8:1234:11::1'
                  dns: '2001:4860:4860::8888'    
          nic2:
            name: nic2
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth2
                connection: conn-eth2
                binding: unc_renci
                ipv4:
                  address: 192.168.14.12/24  
                  gateway: 192.168.14.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:14::12/64'
                  gateway: '2001:db8:1234:14::1'
                  dns: '2001:4860:4860::8888'
          nic3:
            name: nic3     
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth3       
                connection: conn-eth3  
                binding: renci_internal   
                ipv4:
                  address: 192.168.201.11/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:201::11/64'
                  gateway: '2001:db8:1234:201::1'
                  dns: '2001:4860:4860::8888'
          nic4:
            name: nic4
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth4
                connection: conn-eth4
                binding: renci_l3_v4
                ipv4: {}
                ipv6: {}
          nic5:
            name: nic5
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth5
                connection: conn-eth5
                binding: renci_l3_v6
                ipv4: {}
                ipv6: {}
      specific:
        openstack: {}
        ansible:
          control: 'true'   # Ansible control node
          management_network: 'renci_l3_v4' # Ansible management network
          role: ''
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: 'disabled'




