site_topology_nodes:
  nodes:
    node1:
      name: s1-br              
      hostname: s1-br          
      site: WASH
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1       
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: s1_s2   
                ipv4:
                  address: 192.168.12.211/24  
                  gateway: 192.168.12.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:12::211/64'
                  gateway: '2001:db8:1234:12::1'
                  dns: '2001:4860:4860::8888'
          nic2:
            name: nic2
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth2
                connection: conn-eth2
                binding: s1_s3
                ipv4:
                  address: 192.168.13.211/24  
                  gateway: 192.168.13.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:13::211/64'
                  gateway: '2001:db8:1234:13::1'
                  dns: '2001:4860:4860::8888'
          nic3:
            name: nic3     
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth3       
                connection: conn-eth3  
                binding: s1_layer2   
                ipv4:
                  address: 192.168.201.211/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:201::211/64'
                  gateway: '2001:db8:1234:201::1'
                  dns: '2001:4860:4860::8888'
          nic4:
            name: nic4
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth4
                connection: conn-eth4
                binding: s1_layer3
                ipv4: {}
                ipv6: {}
      specific:
        openstack: {}
        ansible:
          control: 'true'   # Ansible control node
          role: ''
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: ''

