site_topology_nodes:
  nodes:
    node1:
      name: lc-10
      hostname: lc-10
      site: MAX
      capacity:
        cpu: 4
        ram: 16
        disk: 40
        os: default_rocky_9
      pci:
        network:
          nic1:
            name: nic1
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: fabnetv4-1
                ipv4: {}
                ipv6: {}
      specific:
        openstack:
          control: 'true'
          network: 'false'
          compute: 'false'
          storage: 'false'
        ansible:
          control: 'true'
          management_network: 'fabnetv4-1'  # Ansible management network
          role: 'webserver,loadbalancer'  # Multiple roles
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: ''

          
    node2:
      name: lc-20
      hostname: lc-20
      site: RUTG
      capacity:
        cpu: 8
        ram: 32
        disk: 100
        os: default_ubuntu_24
      pci:
        network:
          nic1:
            name: nic1
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: fabnetv4-2
                ipv4: {}
                ipv6: {}
      specific:
        openstack:
          control: 'false'
          network: 'false'
          compute: 'true'
          storage: 'false'
        ansible:
          control: 'false'
          management_network: 'fabnetv4-2'  # Ansible management network
          role: 'database'  # Single role
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: ''

          
    node3:
      name: lc-30
      hostname: lc-30
      site: MAX
      capacity:
        cpu: 4
        ram: 16
        disk: 40
        os: default_debian_12
      pci:
        network:
          nic1:
            name: nic1
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: fabnetv4-3
                ipv4: {}
                ipv6: {}
      specific:
        openstack:
          control: 'false'
          network: 'false'
          compute: 'true'
          storage: 'false'
        ansible:
          control: 'false'
          management_network: 'fabnetv4-3'  # Ansible management network
          role: 'webserver'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: ''

          
    node4:
      name: lc-40
      hostname: lc-40
      site: RUTG
      capacity:
        cpu: 2
        ram: 8
        disk: 40
        os: default_ubuntu_24
      pci:
        network:
          nic1:
            name: nic1
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1
                connection: conn-eth1
                binding: fabnetv4-4
                ipv4: {}
                ipv6: {}
      specific:
        openstack:
          control: 'false'
          network: 'false'
          compute: 'false'
          storage: 'true'
        ansible:
          control: 'false'
          management_network: 'fabnetv4-4'  # Ansible management network
          # No role specified - this is OK!
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: ''


site_topology_networks:
  networks:
    net1:
      name: fabnetv4-1
      type: IPv4
      subnet: {}
    net2:
      name: fabnetv4-2
      type: IPv4
      subnet: {}
    net3:
      name: fabnetv4-3
      type: IPv4
      subnet: {}
    net4:
      name: fabnetv4-4
      type: IPv4
      subnet: {}

site_topology_facility_ports:
  facility_ports: {}
