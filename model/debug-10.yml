site_topology_nodes:
  nodes:
    node1:
      name: lc-1              
      hostname: lc-1          
      site: SALT
      worker: salt-w3.fabric-testbed.net
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_ubuntu_25
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1       
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: net_local_1   
                ipv4:
                  address: 192.168.201.211/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: ''
                  gateway: ''
                  dns: '' 
          nic2:
            name: nic2
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth2
                connection: conn-eth2
                binding: net_local_2
                ipv4:
                  address: 192.168.202.211/24
                  gateway: 192.168.202.1
                  dns: 8.8.8.8
                ipv6:
                  address: ''
                  gateway: ''
                  dns: ''
      specific:
        openstack:           # OpenStack role assignments
          control: 'true'    # Control plane node [STRING: 'true' or 'false']
          network: 'true'    # Network services node
          compute: 'false'   # Compute node (hypervisor)
          storage: 'true'    # Storage services node
        ansible:
          control: 'true'   # Ansible control node
          management_network: 'net_local_1'  # Ansible management network
          role: 'webserver'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: 'permissive'

