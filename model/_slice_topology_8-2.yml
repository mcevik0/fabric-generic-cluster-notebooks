site_topology_nodes:
  nodes:
    node1:
      name: lc-1              
      hostname: lc-1          
      site: PSC
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9  
      persistent_storage:
        volume: {}
      pci:
        dpu:
          dpu1:
            name: dpu1        # Logical name on the slice
            model: NIC_ConnectX_7_100
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: fabnetv4   
                ipv4: {}
                ipv6: {}
              iface2:
                device: eth2           
                connection: conn-eth2  
                binding: net_local_1
                ipv4:
                  address: 192.168.201.200/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:1::200/64'
                  gateway: '2001:db8:1234:1::1'
                  dns: '2001:4860:4860::8888'
        fpga: {}
        gpu: {}
        nvme: {}
        network: {}
      specific:
        openstack:           # OpenStack role assignments
          control: 'true'    # Control plane node [STRING: 'true' or 'false']
          network: 'true'    # Network services node
          compute: 'false'   # Compute node (hypervisor)
          storage: 'true'    # Storage services node
        ansible:
          control: 'true'   # Ansible control node
          management_network: 'fabnetv4'  # Ansible management network
          role: 'webserver'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: 'permissive'

    node2:
      name: lc-2
      hostname: lc-2
      site: PSC
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9  
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1        # Logical name on the slice
            model: NIC_ConnectX_5
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: fabnetv4   
                ipv4: {}
                ipv6: {}
              iface2:
                device: eth2           
                connection: conn-eth2  
                binding: net_local_1
                ipv4:
                  address: 192.168.201.201/24  
                  gateway: 192.168.201.1
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1234:1::201/64'
                  gateway: '2001:db8:1234:1::1'
                  dns: '2001:4860:4860::8888'
      specific:
        openstack:           # OpenStack role assignments
          control: 'false'    # Control plane node [STRING: 'true' or 'false']
          network: 'false'    # Network services node
          compute: 'true'   # Compute node (hypervisor)
          storage: 'false'    # Storage services node
        ansible:
          control: 'false'   # Managed node
          management_network: 'fabnetv4'  # Ansible management network
          role: 'webserver'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'
        selinux: 
          mode: 'permissive'

          
