      name: net_local_1
      type: L2Bridge
      subnet:
        ipv4:
          address: 192.168.201.0/24
          gateway: 192.168.201.1
        ipv6:
          address: '2001:db8:1234:1::/64'
          gateway: '2001:db8:1234:1::1'
