site_topology_nodes:
  nodes:
    node1:
      name: ampath1
      hostname: ampath1
      site: WASH
      worker: ''
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_ubuntu_24
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1       
            model: NIC_Basic
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: ampath_sax_1
                ipv4:
                  address: 10.12.1.11/24  
                  gateway: 10.12.1.254
                  dns: 8.8.8.8
                ipv6:
                  address: '2001:db8:1012:1::11/64'
