site_topology_nodes:
  nodes:
    node1:
      name: lc-10
      hostname: lc-10
      site: UCSD
      worker: 'ucsd-w1.fabric-testbed.net'
      capacity:
        cpu: 4                
        ram: 16              
        disk: 10             
        os: default_rocky_9  
      persistent_storage:
        volume: {}
      pci:
        dpu: {}
        fpga: {}
        gpu: {}
        nvme: {}
        network:
          nic1:
            name: nic1       
            model: NIC_Basic 
            interfaces:
              iface1:
                device: eth1           
                connection: conn-eth1  
                binding: l3-FABNetv4-1
                ipv4: {} 
                ipv6: {} 
      specific:
        openstack:
          control: 'true'
          network: 'false'
          compute: 'false'
          storage: 'false'
        ansible:
          control: 'true'   # Ansible control node
          role: 'webserver,loadbalancer'
        postboot: 'echo "--- postboot commands completed." > /tmp/postboot.txt'


